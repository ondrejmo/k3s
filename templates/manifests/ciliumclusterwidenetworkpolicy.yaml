---

apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: default-pods

spec:
  description: Deny by default
  endpointSelector: {}
  egress:
    - toEntities:
        - cluster
  ingress:
    - fromEntities:
        - remote-node
        - host

---

apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: default-allow-prometheus-agent-ingress

spec:
  description: Allow all ingress traffic from prometheus-agent
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring-system
            app.kubernetes.io/name: prometheus-agent

---

apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: default-allow-dns-egress # and intercept

spec:
  description: Intercept all egress DNS traffic from pods
  endpointSelector:
    matchExpressions:
      - key: io.kubernetes.pod.namespace
        operator: NotIn
        values:
          - kube-system
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ingress-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: TCP
            - port: "53"
              protocol: UDP
          rules:
            dns:
              - matchPattern: "*"

---

apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: default-nodes

spec:
  description: Allow traffic among cluster nodes and SSH, NFS from outside
  nodeSelector:
    matchLabels: {}
  egress:
    - toEntities:
        - all
  ingress:
    - fromEntities:
        - host
        - cluster
        - remote-node
        - kube-apiserver
    - fromCIDR: {{ k3s_firewall.whitelist }}
      toPorts:
        - ports:
            # ssh
            - port: "22"
              protocol: TCP
            # nfs
            - port: "2049"
              protocol: TCP
    - fromCIDR: {{ k3s_firewall.whitelist }}
      icmps:
      - fields:
          - type: EchoRequest
            family: IPv4
          - type: EchoReply
            family: IPv4
          - type: DestinationUnreachable
            family: IPv4
          - type: TimeExceeded
            family: IPv4
          - type: ParameterProblem
            family: IPv4
          - type: Redirect
            family: IPv4
