---

apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: cert-manager
  namespace: kube-system

spec:
  chart: https://%{KUBERNETES_API}%/static/charts/cert-manager-{{ k3s_components.cert_manager }}.tgz
  targetNamespace: ingress-system
  # https://github.com/cert-manager/cert-manager/blob/master/deploy/charts/cert-manager/values.yaml
  valuesContent: |-
    fullnameOverride: cert-manager
    enableCertificateOwnerRef: true
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
    startupapicheck:
      enabled: false
    crds:
      enabled: true
    webhook:
      replicaCount: 1
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
    cainjector:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
    prometheus:
      enabled: true
      servicemonitor:
        enabled: true

---

apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: trust-manager
  namespace: kube-system

spec:
  chart: https://%{KUBERNETES_API}%/static/charts/trust-manager-{{ k3s_components.trust_manager }}.tgz
  targetNamespace: ingress-system
  # https://github.com/cert-manager/trust-manager/blob/main/deploy/charts/trust-manager/values.yaml
  valuesContent: |-
    app:
      metrics:
        service:
          enabled: true
          servicemonitor:
            enabled: true
      trust:
        namespace: ingress-system
    resources:
      requests:
        cpu: 5m
        memory: 32Mi
    crds:
      enabled: true
    # secretTargets:
    #   enabled: true
    #   authorizedSecrets:
    #     - ca-certificates

---

apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cert-manager
  namespace: ingress-system

spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: cert-manager
  egress:
    - toFQDNs:
        - matchName: acme-v02.api.letsencrypt.org
        - matchName: api.cloudflare.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY

---

apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cert-manager-webhook
  namespace: ingress-system

spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: webhook
  ingress:
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP

---

apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: trust-manager
  namespace: ingress-system

spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: trust-manager
  ingress:
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP

---

apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-ca

spec:
  selfSigned: {}

---

apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: trusted-ca-bundle

spec:
  sources:
    - useDefaultCAs: true
{% if k3s_tls.internal.crt != "" and k3s_tls.internal.key != "" %}
    - secret:
        name: trusted-ca
        key: tls.crt
{% endif %}
  target:
    configMap:
      key: ca-certificates.crt

{% if k3s_tls.external.email != "" and k3s_tls.external.token != "" %}
---

apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-api-token
  namespace: ingress-system

type: Opaque
stringData:
  token: {{ k3s_tls.external.token }}

---

apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-ca

spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: {{ k3s_tls.external.email }}
    privateKeySecretRef:
      name: cloudflare
    solvers:
      - dns01:
          cloudflare:
            email: {{ k3s_tls.external.email }}
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: token
        selector:
          dnsZones:
          - "{{ k3s_tls.external.domain }}"
          - "*.{{ k3s_tls.external.domain }}"

---

# DISCLAIMER: wildcard certificate and dns record are used so that all domain names do not leak to public

apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: letsencrypt
  namespace: ingress-system

spec:
  commonName: "{{ k3s_tls.external.domain }}"
  dnsNames:
    - "{{ k3s_tls.external.domain }}"
    - "*.{{ k3s_tls.external.domain }}"
  secretName: letsencrypt-certificate
  issuerRef:
    name: letsencrypt-ca
    kind: ClusterIssuer
{% raw %}
---

apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: add-letsencrypt-certificate

spec:
  rules:
    - name: add-secret
      match:
        any:
          - resources:
              kinds:
                - Namespace
      generate:
        generateExisting: true
        synchronize: true
        apiVersion: v1
        kind: Secret
        name: letsencrypt-certificate
        namespace: "{{ request.object.metadata.name }}"
        clone:
          name: letsencrypt-certificate
          namespace: ingress-system

{% endraw %}
{% endif %}
{% if k3s_tls.internal.crt != "" and k3s_tls.internal.key != "" %}
---

apiVersion: v1
kind: Secret
metadata:
  name: trusted-ca
  namespace: ingress-system

stringData:
  tls.crt: |
    {{ k3s_tls.internal.crt | indent(4) }}
  tls.key: |
    {{ k3s_tls.internal.key | indent(4) }}

---

apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: trusted-ca

spec:
  ca:
    secretName: trusted-ca

{% endif %}
